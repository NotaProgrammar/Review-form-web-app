<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>اطلاعات مشتری</title>

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
font-family: 'Vazirmatn', 'Tahoma', sans-serif;
background: linear-gradient(135deg, #f5f7fa, #e4ecf5);
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
color: #333;
}

.container {
background: white;
padding: 40px 30px;
border-radius: 20px;
box-shadow: 0 15px 35px rgba(0,0,0,0.08);
text-align: center;
max-width: 400px;
width: 90%;
}

h1 {
color: #ff6b35;
margin-bottom: 20px;
font-size: 24px;
font-weight: 700;
}

p {
font-size: 15px;
line-height: 1.8;
margin-bottom: 35px;
color: #555;
}

.start-btn {
font-family: "Vazirmatn", Tahoma, sans-serif;
display: inline-block;
background-color: #ff6b35;
color: white;
padding: 14px 45px;
text-decoration: none;
border-radius: 10px;
font-weight: bold;
font-size: 18px;
box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
transition: all 0.3s ease;
border: none;
cursor: pointer;
}

.start-btn:hover {
background-color: #e85a2b;
transform: translateY(-2px);
box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4);
}


form{
display:flex;
flex-direction:column;
gap:15px;
}

input{
font-family:inherit;
padding:12px 15px;
border-radius:10px;
border:1px solid #ddd;
font-size:14px;
text-align:right;
}

input:focus{
outline:none;
border-color:#ff6b35;
box-shadow:0 0 6px rgba(255,107,53,0.25);
}
</style>

</head>

<body>

<div class="container">

<h1>اطلاعات شما</h1>

<p>
لطفاً اطلاعات خود را وارد کنید و سپس ادامه دهید.
</p>

<form action="/form/foods_page/" method="post">

    {% csrf_token %}

<input
type="text"
name="first_name"
placeholder="نام"
required
oninvalid="this.setCustomValidity('لطفاً نام خود را وارد کنید')"
oninput="this.setCustomValidity('')">


<input
type="text"
name="last_name"
placeholder="نام خانوادگی"
required
oninvalid="this.setCustomValidity('لطفاً نام خانوادگی خود را وارد کنید')"
oninput="this.setCustomValidity('')">


<input
type="tel"
name="phone"
placeholder="شماره تلفن"
required
oninvalid="this.setCustomValidity('لطفاً شماره تلفن را وارد کنید')"
oninput="this.setCustomValidity('')">


<button type="submit" class="start-btn">ادامه</button>

</form>

</div>

</body>
</html>
