<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>انتخاب غذا</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
font-family:'Vazirmatn',Tahoma,sans-serif;
background:linear-gradient(135deg,#f5f7fa,#e4ecf5);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 15px 35px rgba(0,0,0,0.08);
width:90%;
max-width:450px;
text-align:center;
}

h1{
color:#ff6b35;
}

.food-list{
text-align:right;
margin:25px 0;
}

.food-item{
margin:10px 0;
font-size:15px;
}

button{
font-family: "Vazirmatn", Tahoma, sans-serif;
background:#ff6b35;
color:white;
border:none;
padding:14px 40px;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

button:hover{
background:#e85a2b;
}
</style>

</head>

<body>

<div class="container">

<h1>انتخاب غذا</h1>

<p>
    شما کدام یک از غذا‌های مارا تهیه کرده‌اید؟
</p>


{% if error %}
<p style="color:red; margin-top:10px;">
{{ error }}
</p>
{% endif %}

<form method="post" action="/form/service_form/">
{% csrf_token %}

<div class="food-list">

{% for food in foods %}
<div class="food-item">
<label>
<input type="checkbox" name="foods" value="{{ food.id }}">
{{ food.name }}
</label>
</div>
{% endfor %}

</div>

<button type="submit">ادامه</button>

</form>

</div>

</body>
</html>
