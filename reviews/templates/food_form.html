<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>ثبت نظر درباره غذا</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&family=Shabnam:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body{
        font-family:'Vazirmatn',Tahoma,sans-serif;
        background:linear-gradient(135deg,#f5f7fa,#e4ecf5);
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        margin:0;
        }

        .checkbox-label{
            display:flex;
            gap:7px;
            cursor:pointer;
            align-items:center;
            flex-direction: row-reverse;
            cursor:pointer;
        }

        .checkbox-label input[type="checkbox"]{
            margin:0;
            transform: scale(1.6);
            cursor:pointer;
        }

        .container{
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 15px 35px rgba(0,0,0,0.08);
        width:90%;
        max-width:500px;
        }

        h1{
        text-align:center;
        color:#ff6b35;
        }

        label{
        display:block;
        margin-top:15px;
        font-size:14px;
        }

        .food-name{
        background:#f8f8f8;
        padding:10px;
        border-radius:8px;
        margin-top:5px;
        border:1px solid #ddd;
        }

        input, select, textarea{
        width:100%;
        padding:10px;
        border-radius:8px;
        border:1px solid #ddd;
        margin-top:6px;
        font-family:inherit;
        }

        .checkbox-box {
        text-align:right;
        margin:15px 0;
        margin-top:10px;
        }

        textarea{
        resize:vertical;
        }

        button{
        margin-top:25px;
        width:100%;
        background:#ff6b35;
        color:white;
        border:none;
        padding:14px;
        border-radius:10px;
        font-size:16px;
        cursor:pointer;
        font-family: "Vazirmatn", Tahoma, sans-serif;
        }


        button:hover{
        background:#e85a2b;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>ثبت نظر درباره غذا</h1>

        <form method="post" action="/form/next_food_page/">
            {% csrf_token %}
            <input type="hidden" name="food_id" value="{{ food_id }}">
            <label>نام غذا</label>
            <div class="food-name">
                {{ food_name }}
            </div>

            <div class="checkbox-box">
                <label class="checkbox-label">
        <input type="checkbox" name="first_time">
        <span>این اولین باری است که این غذا را امتحان می‌کنم</span>
    </label>
            </div>

            <label>تعداد سفارش</label>
            <input type="number" name="quantity" min="1" value="1" required>

            <label>کیفیت غذا</label>
            <select name="food_quality">
<option value="E">عالی</option>
<option value="G">خوب</option>
<option value="M" selected>متوسط</option>
<option value="B">بد</option>
<option value="T">خیلی بد</option>
</select>

            <label>حجم غذا</label>
            <select name="food_size">
<option value="G">بزرگ</option>
<option value="M" selected>متوسط</option>
<option value="B">کوچک</option>
</select>

            <label>قیمت غذا</label>
            <select name="food_price">
<option value="I">ارزان</option>
<option value="W" selected>مناسب</option>
<option value="E">گران</option>
</select>

            <label>نظر شما</label>
            <textarea name="review_text" rows="4" placeholder="نظر خود را درباره این غذا بنویسید"></textarea>

            <button type="submit">ثبت و ادامه</button>

        </form>

    </div>

</body>

</html>
