<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خوش‌آمدگویی</title>

    <!-- اتصال به فونت استاندارد فارسی Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #f5f7fa, #e4ecf5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #ff6b35;
            margin-bottom: 20px;
            font-size: 24px;
            font-weight: 700;
        }
        p {
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 35px;
            color: #555;
        }
        .start-btn {
            display: inline-block;
            background-color: #ff6b35;
            color: white;
            padding: 14px 45px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 5px 15px rgba(255, 107, 53, 0.3);
            transition: all 0.3s ease;
        }
        .start-btn:hover {
            background-color: #e85a2b;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>خوش آمدید!</h1>
        <p>از انتخاب رستوران ما سپاسگزاریم. خوشحال می‌شویم نظرات شما را درباره تجربه‌تان بدانیم. لطفاً با پاسخ به چند سوال کوتاه، ما را در بهبود خدمات یاری کنید.</p>
        <a href="/form/customer_details/" class="start-btn">شروع</a>
    </div>

</body>
</html>
