<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<title>پایان نظرسنجی</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&family=Shabnam:wght@400;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(135deg, #f5f7fa, #e4ecf5);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}

.container {
    background: white;
    padding: 40px 35px;
    border-radius: 22px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    width: 90%;
    max-width: 520px;
    text-align: center;
}

.icon {
    width: 85px;
    height: 85px;
    background: #fff3ed;
    color: #ff6b35;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 0 auto 22px;
    font-size: 42px;
    font-weight: bold;
}

h1 {
    color: #ff6b35;
    margin-bottom: 15px;
    font-size: 26px;
}

p {
    color: #555;
    line-height: 2;
    font-size: 15px;
    margin: 10px 0;
}

.thank-text {
    background: #f8f8f8;
    border: 1px solid #eee;
    border-radius: 14px;
    padding: 18px;
    margin-top: 25px;
}

.home-btn {
    display: inline-block;
    margin-top: 28px;
    background: #ff6b35;
    color: white;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 10px;
    font-size: 15px;
    transition: 0.2s ease;
}

.home-btn:hover {
    background: #e85a2b;
}

.footer-note {
    margin-top: 22px;
    font-size: 13px;
    color: #888;
}
</style>

</head>

<body>

<div class="container">

    <div class="icon">✓</div>

    <h1>از شما سپاسگزاریم</h1>

    <p>
        نظر شما با موفقیت ثبت شد.
    </p>

    <div class="thank-text">
        <p>
            از اینکه وقت ارزشمند خود را برای شرکت در این نظرسنجی اختصاص دادید،
            صمیمانه تشکر می‌کنیم.
        </p>
        <p>
            بازخورد شما به ما کمک می‌کند کیفیت خدمات و غذاها را بهبود دهیم.
        </p>
    </div>

    <div class="footer-note">
        امیدواریم دوباره میزبان شما باشیم.
    </div>

</div>

</body>
</html>
